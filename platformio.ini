; PlatformIO — STM32F411 Black Pill (WeAct)
[platformio]
default_envs = blackpill_f411ce
; Build outside the Cyrillic path: the STM32 linker cannot use it
workspace_dir = C:/pio-build/stm32-blackpill

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

; Serial Monitor over the board's USB-C (no USB-TTL needed)
build_flags =
  -std=gnu++17
  -D USBCON
  -D USBD_USE_CDC
build_unflags = -std=gnu++11
