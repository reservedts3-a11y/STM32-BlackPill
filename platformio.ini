; PlatformIO — STM32F411 «Black Pill» (WeAct)
[platformio]
src_dir = .
default_envs = blackpill_f411ce

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200

; --- Обери спосіб прошивки ---
upload_protocol = stlink
; upload_protocol = dfu
; upload_protocol = serial

; --- Serial Monitor прямо через USB-C плати (щоб не потрібен був USB-TTL) ---
build_flags =
  -std=gnu++17
  -D USBCON
  -D USBD_USE_CDC
build_unflags = -std=gnu++11

; Увімкни лише один скетч: розкоментуй потрібний рядок, інші залиш закоментованими.
build_src_filter =
  ; +<main_step6_final_stm32.cpp>
  +<main_blink_nonblocking_stm32.cpp>
  ; +<main_extra_deepsleep_stm32.cpp> (edited) 


